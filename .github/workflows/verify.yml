name: Verify SPU Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe AU installer in temporary directories
        run: python3 -m unittest discover -s tests -p 'test_install_au.py' -v
      - name: Initialize pinned native SDK
        run: git submodule update --init vendor/tetorica-soundchip-native
      - run: cmake --preset offline
      - run: cmake --build --preset offline --parallel 4
      - run: ctest --preset offline

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe AU installer in temporary directories
        run: python3 -m unittest discover -s tests -p 'test_install_au.py' -v
      - name: Initialize and verify pinned dependencies
        run: python3 scripts/bootstrap.py
      - run: python3 scripts/bootstrap.py --check
      - run: cmake --preset macos
      - run: cmake --build --preset macos --parallel 4
      - run: ctest --preset macos
      - name: Install and validate the user AU
        run: |
          python3 scripts/install_au.py --install
          python3 scripts/validate_au.py --refresh-ci-registry
      - name: Validate VST3
        run: sh scripts/validate_vst3.sh build/macos/out/TetoricaSPU.vst3
      - name: Render and restore the actual VST3
        run: sh scripts/check_vst3_audio.sh build/macos/out/TetoricaSPU.vst3
      - name: Restore embedded state in the actual AU
        run: sh scripts/check_au_state.sh build/macos/out/TetoricaSPU.component
      - uses: actions/upload-artifact@v4
        with:
          name: macos-development-bundles
          path: build/macos/out/
          if-no-files-found: error
